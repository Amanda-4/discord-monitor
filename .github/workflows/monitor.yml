name: Discord Invite Monitor

on:
  schedule:
    # 每 5 分钟在云端自动检测一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 支持手动点击测试

jobs:
  check-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord Invite Status
        run: |
          # 1. 模拟正常浏览器发起请求
          HTTP_CODE=$(curl -s -w "%{http_code}" -o response.json \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://discord.com/api/v9/invites/elysianhorizon")

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body:"
          cat response.json
          echo ""

          # 2. 核心精确判断：
          # 状态码为 200，且返回数据中不再包含 "INVITES_DISABLED"，说明邀请真正开放！
          if [ "$HTTP_CODE" -eq 200 ] && ! grep -q "INVITES_DISABLED" response.json; then
            echo "SUCCESS: Invite is OPEN! Triggering repeated Bark alerts..."
            
            # 连发 3 次，每次留足 12 秒让当前旋律完整播放
            for i in 1 2 3
            do
              echo "Sending alert #$i..."
              curl -s "https://api.day.app/9waVKMEhyRHfLrDuRHFZ9f/%E9%82%80%E8%AF%B7%E5%B7%B2%E5%BC%80%E6%94%BE%EF%BC%81/%E7%AC%AC${i}%E6%AC%A1%E6%8F%90%E9%86%92%EF%BC%9A%E7%AB%8B%E5%8D%B3%E5%89%8D%E5%BE%80Discord%E6%8E%A5%E5%8F%97%E9%82%80%E8%AF%B7?sound=minuet&level=critical&volume=10"
              sleep 12
            done
          else
            echo "STATUS: Invites are still DISABLED. No alert sent."
          fi
