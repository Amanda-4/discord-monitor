name: Discord Invite Monitor

on:
  schedule:
    # 每 5 分钟在云端自动运行一次
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允许你在网页上手动点击测试

jobs:
  check-invite:
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord Invite Status
        run: |
          # 请求 Discord API
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" "https://discord.com/api/v9/invites/elysianhorizon")
          echo "Current HTTP Code: $HTTP_CODE"
          cat response.json
          
          # 判断条件：目前关闭时返回 404 (Unknown Invite)
          # 只要状态码不是 404，说明邀请已经开放
          if [ "$HTTP_CODE" -ne 404 ]; then
            echo "Invite opened! Sending Bark alert..."
            curl -s "https://api.day.app/9waVKMEhyRHfLrDuRHFZ9f/%E9%82%80%E8%AF%B7%E5%B7%B2%E5%BC%80%E6%94%BE/%E7%AB%8B%E5%8D%B3%E5%89%8D%E5%BE%80Discord%E6%8E%A5%E5%8F%97%E9%82%80%E8%AF%B7?sound=alarm&level=critical&volume=10"
          else
            echo "Still closed. Nothing sent."
          fi
